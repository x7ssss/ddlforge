name: ddlforge Migration Reliability Gate

on:
  pull_request:
    paths:
      - '**/migrations/**'
      - '**/schema.prisma'
      - '**/drizzle/**'
      - '**/*.sql'

jobs:
  ddlforge-gate:
    name: Zero-Downtime Migration Inspection
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Migration Lock Linting
        run: |
          npx ddlforge check ./prisma/migrations --format github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disaster Recovery & WAL Archival Doctor
        run: |
          npx ddlforge doctor --db postgresql://postgres:postgrespassword@localhost:5432/ci_test

      - name: Preflight Blast Radius & Disk Capacity Audit
        run: |
          npx ddlforge preflight --db postgresql://postgres:postgrespassword@localhost:5432/ci_test

      - name: Dry-Run Migration Execution in Ephemeral Container
        run: |
          npx ddlforge test --max-lock-ms 500
